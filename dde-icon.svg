<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Digital Design Explorer</title>
  <defs>
    <linearGradient id="mask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#147560"/>
      <stop offset="1" stop-color="#0B4A3D"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3445"/>
      <stop offset="1" stop-color="#1A2030"/>
    </linearGradient>
  </defs>
  <!-- PCB tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#mask)"/>
  <!-- copper traces running out to the edges -->
  <g stroke="#E0A458" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M176 120 V70 H120"/>
    <path d="M336 120 V84 H400"/>
    <path d="M392 216 H446"/>
    <path d="M392 296 H430 V352"/>
    <path d="M296 392 V440"/>
    <path d="M176 392 V426 H130"/>
    <path d="M120 256 H66"/>
    <path d="M120 336 H90 V400"/>
  </g>
  <g fill="#E0A458">
    <circle cx="120" cy="70" r="14"/><circle cx="400" cy="84" r="14"/>
    <circle cx="446" cy="216" r="14"/><circle cx="430" cy="352" r="14"/>
    <circle cx="296" cy="440" r="14"/><circle cx="130" cy="426" r="14"/>
    <circle cx="66" cy="256" r="14"/><circle cx="90" cy="400" r="14"/>
  </g>
  <!-- chip pins -->
  <g fill="#C9CFD6">
    <rect x="160" y="104" width="32" height="28" rx="5"/><rect x="240" y="104" width="32" height="28" rx="5"/><rect x="320" y="104" width="32" height="28" rx="5"/>
    <rect x="160" y="380" width="32" height="28" rx="5"/><rect x="240" y="380" width="32" height="28" rx="5"/><rect x="280" y="380" width="32" height="28" rx="5"/>
    <rect x="104" y="160" width="28" height="32" rx="5"/><rect x="104" y="240" width="28" height="32" rx="5"/><rect x="104" y="320" width="28" height="32" rx="5"/>
    <rect x="380" y="200" width="28" height="32" rx="5"/><rect x="380" y="280" width="28" height="32" rx="5"/><rect x="380" y="320" width="28" height="32" rx="5"/>
  </g>
  <!-- chip body -->
  <rect x="124" y="124" width="264" height="264" rx="36" fill="url(#die)"/>
  <rect x="124" y="124" width="264" height="264" rx="36" fill="none" stroke="#3E4A60" stroke-width="4"/>
  <circle cx="156" cy="156" r="8" fill="#3E4A60"/>
  <!-- compass dial -->
  <circle cx="256" cy="256" r="96" fill="none" stroke="#E0A458" stroke-width="8"/>
  <g stroke="#E0A458" stroke-width="8" stroke-linecap="round">
    <line x1="256" y1="172" x2="256" y2="188"/><line x1="256" y1="324" x2="256" y2="340"/>
    <line x1="172" y1="256" x2="188" y2="256"/><line x1="324" y1="256" x2="340" y2="256"/>
  </g>
  <!-- needle: north half red, south half silver, tilted like it's exploring -->
  <g transform="rotate(35 256 256)">
    <path d="M256 180 L282 256 L230 256 Z" fill="#E5533F"/>
    <path d="M256 332 L282 256 L230 256 Z" fill="#E8ECEF"/>
  </g>
  <circle cx="256" cy="256" r="12" fill="#1A2030" stroke="#E0A458" stroke-width="6"/>
</svg>
