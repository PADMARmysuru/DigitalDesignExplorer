<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level 1 Certificate | Digital Design Explorer</title>
<!-- Digital Design Explorer: common platform (access control, header, navigation, footer) -->
<script src="access-control.js"></script>
<link rel="stylesheet" href="common.css">
<script src="common.js" defer></script>
<style>body{margin:0;background:#eef1f6;font-family:"Segoe UI",system-ui,Arial,sans-serif}</style>
</head>
<body>
<!--
  Level 1 certificate.
  Eligibility is checked when the page opens, using the same progress keys the
  Level 1 dashboard uses. If any requirement is missing, a "Certificate Locked"
  checklist is shown instead of the certificate, so opening this file directly
  cannot bypass the rules. The certificate itself is drawn by common.js.
-->
<main id="ddeCertificate" data-dde-certificate="1">
  <noscript><p style="padding:30px;text-align:center">Please enable JavaScript to view your certificate.</p></noscript>
</main>
</body>
</html>
