<!DOCTYPE html>
<html>

<head>
<!-- Digital Design Explorer: common platform (access control, header, navigation, footer) -->
<script src="access-control.js"></script>
<link rel="stylesheet" href="common.css">
<script src="common.js" defer></script>

    <title>Digital Design Explorer - Student Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="supabase-config.js"></script>
</head>

<body>

<header>
    <h1>🎓 Digital Design Explorer</h1>
    <p>Student Registration & Login</p>
</header>

<div class="login-container">

    <h2>📝 Student Registration</h2>

    <input type="text" id="studentName"
           placeholder="Student Name">

    <input type="text" id="studentUSN"
           placeholder="USN (e.g. 4GW24EC001)" autocapitalize="characters" autocomplete="off">

    <input type="text" id="studentBranch"
           placeholder="Branch">

    <input type="text" id="studentSemester"
           placeholder="Semester">

    <input type="text" id="studentSection"
           placeholder="Section">

    <input type="email" id="studentEmail"
           placeholder="Email ID">

    <input type="password" id="studentPassword"
           placeholder="Password">

    <button onclick="registerStudent()">
        Register
    </button>

    <p id="registerMessage"></p>

    <hr>

    <h2>🔐 Student Login</h2>

    <input type="text" id="loginUSN"
           placeholder="USN (e.g. 4GW24EC001)" autocapitalize="characters" autocomplete="off">

    <input type="email" id="loginEmail"
           placeholder="Email ID">

    <input type="password" id="loginPassword"
           placeholder="Password">

    <button onclick="loginStudent()">
        Login
    </button>

    <p id="loginMessage"></p>

</div>

<script>
/* ---- USN rule: 4GWxxECxxx (pattern defined once in access-control.js) ---- */
function showInvalidUSN(messageId) {
    const el = document.getElementById(messageId);
    el.innerHTML = "<strong>Invalid USN</strong><br>Please enter your USN in the format: <strong>4GWxxECxxx</strong><br>Example: <strong>4GW24EC001</strong>";
    el.style.color = "red";
}
function validateUSNField(inputId, messageId) {
    const input = document.getElementById(inputId);
    const usn = String(input.value || "").trim().toUpperCase();
    if (!USN_PATTERN.test(usn)) { showInvalidUSN(messageId); return null; }
    input.value = usn;
    return usn;
}

async function registerStudent() {
    // Validate the USN first: an invalid USN is never saved locally or sent to Supabase
    const validUSN = validateUSNField("studentUSN", "registerMessage");
    if (!validUSN) return;

    const studentId = crypto.randomUUID();
localStorage.setItem("studentId", studentId);
    let student = {

        name:
            document.getElementById("studentName").value,

        usn:
            validUSN,

        branch:
            document.getElementById("studentBranch").value,

        semester:
            document.getElementById("studentSemester").value,

        section:
            document.getElementById("studentSection").value,

        email:
            document.getElementById("studentEmail").value,

        password:
            document.getElementById("studentPassword").value

    };

    // Keep the existing local login system
    localStorage.setItem(
        "studentAccount",
        JSON.stringify(student)
    );

    // Save student information to Supabase
    try {

        const response = await fetch(
            SUPABASE_URL + "/rest/v1/STUDENTS",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_ANON_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_ANON_KEY,
                 "Prefer": "return=minimal"
                },

                body: JSON.stringify({
                    id: studentId,
                    student_id: student.usn,
                    student_name: student.name,
                    email: student.email,
                    branch: student.branch,
                    semester: student.semester,
                    section: student.section
                })
            }
        );

        if (!response.ok) {

            const errorText = await response.text();

            console.error(
                "Supabase registration error:",
                errorText
            );

            document.getElementById("registerMessage")
                .innerText =
                "Registration saved locally, but database saving failed.";

            document.getElementById("registerMessage")
                .style.color = "orange";

            return;
        }

        
const progressResponse = await fetch(
    SUPABASE_URL + "/rest/v1/student_progress",
    {
        method: "POST",

        headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY,
            "Authorization":
                "Bearer " + SUPABASE_ANON_KEY,
            "Prefer": "return=minimal"
        },

        body: JSON.stringify({
            student_id: studentId,
            logic_gates: 0,
            digital_circuits: 0,
            quiz_score: 0,
            quiz_total: 110,
            kmap: 0,
            verilog: 0,
            certificate: false
        })
    }
);
console.log("Progress insert status:", progressResponse.status);
console.log("Progress insert response:", await progressResponse.text());

        document.getElementById("registerMessage")
            .innerText =
            "✅ Registration successful! You can now login.";

        document.getElementById("registerMessage")
            .style.color = "green";

    } catch (error) {

        console.error(
            "Supabase connection error:",
            error
        );

        document.getElementById("registerMessage")
            .innerText =
            "Registration saved locally. Database connection failed.";

        document.getElementById("registerMessage")
            .style.color = "orange";
    }

}


function loginStudent() {
    const enteredUSN = validateUSNField("loginUSN", "loginMessage");
    if (!enteredUSN) return;

    let savedStudent = null;
    try { savedStudent = JSON.parse(localStorage.getItem("studentAccount")); } catch (e) { savedStudent = null; }

    let email = document.getElementById("loginEmail").value;
    let password = document.getElementById("loginPassword").value;

    if (!savedStudent) {
        document.getElementById("loginMessage").innerText = "❌ Please register first.";
        document.getElementById("loginMessage").style.color = "red";
        return;
    }

    const savedUSN = String(savedStudent.usn || "").trim().toUpperCase();
    if (!USN_PATTERN.test(savedUSN)) {
        document.getElementById("loginMessage").innerHTML = "<strong>Invalid USN</strong><br>The account saved on this device does not have a valid USN (format <strong>4GWxxECxxx</strong>, e.g. <strong>4GW24EC001</strong>). Please register again with your correct USN.";
        document.getElementById("loginMessage").style.color = "red";
        return;
    }

    if (email === savedStudent.email && password === savedStudent.password && enteredUSN === savedUSN) {
        localStorage.setItem("studentLoggedIn", "true");
        // Return to the page the student originally asked for (only pages of this site)
        const next = new URLSearchParams(window.location.search).get("next");
        window.location.href = (next && /^[a-z0-9-]+\.html$/i.test(next) && next !== "login.html") ? next : "student-dashboard.html";
    } else {
        document.getElementById("loginMessage").innerText = "❌ Invalid USN, Email or Password.";
        document.getElementById("loginMessage").style.color = "red";
    }
}
</script>

</body>
</html>
