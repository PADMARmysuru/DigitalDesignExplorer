<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sequential Circuits - 20 Problems | Level 2</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#222}
header{background:#243b64;color:white;text-align:center;padding:22px}
header h1{margin:0}
.container{max-width:1050px;margin:25px auto;padding:15px}
.top{background:white;padding:18px;border-radius:12px;box-shadow:0 3px 10px #0001;margin-bottom:20px}
.progress{height:12px;background:#ddd;border-radius:10px;overflow:hidden;margin-top:10px}
.progress-bar{height:100%;width:0;background:#28a745}
.problem{background:white;padding:22px;border-radius:12px;box-shadow:0 3px 10px #0001;margin-bottom:20px}
.problem h2{color:#243b64;margin-top:0}
.question{font-size:19px;font-weight:bold;line-height:1.5}
.options{display:grid;gap:10px;margin-top:18px}
.option{padding:13px;border:2px solid #d5dce8;border-radius:8px;background:#fafcff;cursor:pointer}
.option:hover{background:#eef4ff}
.option.selected{border-color:#243b64;background:#eaf0fb}
.option.correct{border-color:#2e7d32;background:#e8f5e9}
.option.wrong{border-color:#c62828;background:#ffebee}
.feedback{display:none;margin-top:15px;padding:12px;border-radius:8px;font-weight:bold}
.feedback.ok{display:block;background:#e8f5e9;color:#155724}
.feedback.no{display:block;background:#ffebee;color:#721c24}
button{border:0;border-radius:8px;padding:11px 18px;background:#243b64;color:white;font-weight:bold;cursor:pointer;margin:5px}
button:hover{background:#162746}
button.secondary{background:#666}
.result{display:none;background:#eef3fb;padding:18px;border-radius:10px;text-align:center;font-size:20px;font-weight:bold}
.badge{display:inline-block;background:#e8eef8;color:#243b64;padding:6px 12px;border-radius:20px;font-weight:bold}
</style>
</head>
<body>

<header>
<h1>🔄 Level 2 — Sequential Circuits</h1>
<p>20 Practical Problems</p>
</header>

<div class="container">
<div class="top">
<div><b>Progress:</b> <span id="progressText">0 / 20 completed</span></div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
</div>

<div id="quiz"></div>

<div class="result" id="result"></div>

<div style="text-align:center">
<button onclick="checkAll()">✓ Check All Answers</button>
<button class="secondary" onclick="resetQuiz()">↺ Reset</button>
<a href="index.html"><button class="secondary">← Home</button></a>
</div>
</div>

<script>
const problems = [
{
q:"1. An SR latch is built using NOR gates. What happens when S = 1 and R = 0?",
o:["Q becomes 0","Q becomes 1","Q toggles","Invalid condition"],a:1
},
{
q:"2. For a NOR-based SR latch, which input combination is invalid?",
o:["S=0, R=0","S=0, R=1","S=1, R=0","S=1, R=1"],a:3
},
{
q:"3. An SR latch has S = 0 and R = 1. What is the next value of Q?",
o:["0","1","Q","Invalid"],a:0
},
{
q:"4. A D latch has D = 1 and Enable = 1. What will Q become?",
o:["0","1","Toggle","Invalid"],a:1
},
{
q:"5. A D flip-flop currently has Q = 0. D = 1 is applied and a clock edge occurs. What is Q(next)?",
o:["0","1","Q","Invalid"],a:1
},
{
q:"6. A D flip-flop currently has Q = 1. D = 0 is applied. After the active clock edge, Q becomes:",
o:["0","1","Toggle","Invalid"],a:0
},
{
q:"7. Which edge causes a positive-edge-triggered flip-flop to capture its input?",
o:["Falling edge","Rising edge","Both edges","No clock edge"],a:1
},
{
q:"8. A JK flip-flop has J = 0 and K = 0. If Q = 1, what is Q(next)?",
o:["0","1","Toggle to 0","Invalid"],a:1
},
{
q:"9. A JK flip-flop has J = 0 and K = 1. If Q = 1, what is Q(next)?",
o:["0","1","Toggle to 0","Invalid"],a:0
},
{
q:"10. A JK flip-flop has J = 1 and K = 1. If Q = 0, what is Q(next)?",
o:["0","1","Q remains 0","Invalid"],a:1
},
{
q:"11. A JK flip-flop starts with Q = 0. Three clock pulses are applied with J = K = 1. What is the final Q?",
o:["0","1","Remains unchanged","Invalid"],a:1
},
{
q:"12. A T flip-flop has T = 0. If Q = 1 and a clock edge occurs, what is Q(next)?",
o:["0","1","Toggle to 0","Invalid"],a:1
},
{
q:"13. A T flip-flop has T = 1 and starts with Q = 0. After two clock pulses, what is Q?",
o:["0","1","Undefined","Invalid"],a:0
},
{
q:"14. A T flip-flop starts at Q = 0. T = 1 is applied for four consecutive clock pulses. What is the final Q?",
o:["0","1","Toggle continuously","Invalid"],a:0
},
{
q:"15. A 2-bit asynchronous binary counter starts at 00. What is the sequence after successive clock pulses?",
o:["00 → 01 → 10 → 11","00 → 10 → 01 → 11","00 → 11 → 10 → 01","01 → 10 → 11 → 00"],a:0
},
{
q:"16. A 3-bit binary counter is at 101. What is the next state after one count pulse?",
o:["100","110","101","111"],a:0
},
{
q:"17. A 2-bit synchronous counter is currently at 11. What is the next state in a normal binary up-counter?",
o:["00","01","10","11"],a:0
},
{
q:"18. A sequential circuit has present state Q1Q0 = 10. Its next-state logic produces Q1(next)Q0(next) = 11. What state will appear after the active clock edge?",
o:["00","01","10","11"],a:3
},
{
q:"19. A sequence detector is designed to detect the bit pattern 101. Which input sequence contains the first complete occurrence of 101?",
o:["1001","1101","0101","1110"],a:2
},
{
q:"20. Final challenge: A state machine follows the sequence 00 → 01 → 11 → 10 → 00. What type of sequence is this?",
o:["2-bit Gray-code sequence","4-bit binary sequence","Johnson counter sequence","SR latch sequence"],a:0
}
];

let answers=JSON.parse(localStorage.getItem("sequential20Answers")||"{}");
let completed=JSON.parse(localStorage.getItem("sequential20Completed")||"[]");

function render(){
 const quiz=document.getElementById("quiz");
 quiz.innerHTML="";
 problems.forEach((p,i)=>{
  const div=document.createElement("div");
  div.className="problem";
  div.innerHTML=`<span class="badge">Problem ${i+1} of 20</span>
  <h2>Sequential Circuit Problem ${i+1}</h2>
  <div class="question">${p.q}</div>
  <div class="options">${p.o.map((x,j)=>`
  <div class="option ${answers[i]===j?"selected":""}" data-i="${i}" data-a="${j}">${String.fromCharCode(65+j)}. ${x}</div>`).join("")}</div>
  <div class="feedback" id="fb${i}"></div>`;
  quiz.appendChild(div);
 });
 document.querySelectorAll(".option").forEach(el=>{
  el.addEventListener("click",()=>{
   const i=Number(el.dataset.i), a=Number(el.dataset.a);
   answers[i]=a;
   localStorage.setItem("sequential20Answers",JSON.stringify(answers));
   document.querySelectorAll(`.option[data-i="${i}"]`).forEach(x=>x.classList.remove("selected"));
   el.classList.add("selected");
  });
 });
 updateProgress();
}

function checkAll(){
 let score=0;
 problems.forEach((p,i)=>{
  const opts=document.querySelectorAll(`.option[data-i="${i}"]`);
  const fb=document.getElementById("fb"+i);
  opts.forEach(x=>x.classList.remove("correct","wrong"));
  if(answers[i]===undefined){
   fb.className="feedback no";
   fb.textContent="Please answer this problem.";
   return;
  }
  if(answers[i]===p.a){
   score++;
   completed[i]=true;
   opts[p.a].classList.add("correct");
   fb.className="feedback ok";
   fb.textContent="✅ Correct!";
  }else{
   completed[i]=false;
   opts[answers[i]].classList.add("wrong");
   opts[p.a].classList.add("correct");
   fb.className="feedback no";
   fb.textContent="❌ Incorrect. The correct answer is "+String.fromCharCode(65+p.a)+".";
  }
 });
 localStorage.setItem("sequential20Completed",JSON.stringify(completed));
 updateProgress();
 const result=document.getElementById("result");
 result.style.display="block";
 result.textContent=`Score: ${score} / 20`;
 if(score===20){
  result.textContent="🎉 Excellent! All 20 Sequential Circuit Problems completed!";
  localStorage.setItem("sequentialCircuitsDone","true");
 }
 window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

function updateProgress(){
 const n=completed.filter(Boolean).length;
 document.getElementById("progressText").textContent=`${n} / 20 completed`;
 document.getElementById("progressBar").style.width=(n/20*100)+"%";
}

function resetQuiz(){
 answers={}; completed=[];
 localStorage.removeItem("sequential20Answers");
 localStorage.removeItem("sequential20Completed");
 localStorage.removeItem("sequentialCircuitsDone");
 document.getElementById("result").style.display="none";
 render();
 window.scrollTo({top:0,behavior:"smooth"});
}
render();
</script>
</body>
</html>
